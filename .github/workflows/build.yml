name: Build AirDropTV

# 태그를 푸시하면 릴리스에 .tipa 가 첨부됩니다.
#   git tag v1.0 && git push origin v1.0
# Actions 탭에서 Run workflow 로 수동 실행하면 아티팩트로만 남습니다.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # 릴리스에 파일을 첨부하려면 필요합니다

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 도구 설치 (xcodegen, ldid)
        run: brew install xcodegen ldid

      - name: 환경 진단 (실패 시 원인 파악용)
        run: |
          echo "선택된 Xcode: $(xcode-select -p)"
          xcodebuild -version
          xcodegen --version
          echo "설치된 tvOS SDK:"
          xcodebuild -showsdks | grep -i tvos || echo "  (tvOS SDK 없음)"

      - name: Xcode 프로젝트 생성
        run: |
          xcodegen generate
          echo "생성된 프로젝트 포맷(objectVersion):"
          grep -m1 objectVersion AirDropTV.xcodeproj/project.pbxproj

      # -scheme 대신 -target 을 씁니다. XcodeGen 은 요청하지 않으면 스킴을
      # 만들지 않으므로, 타깃을 직접 지정하는 편이 안전합니다.
      # -derivedDataPath 는 -scheme 과만 함께 쓸 수 있으므로,
      # -target 을 쓰는 여기서는 SYMROOT 로 산출물 위치를 지정합니다.
      - name: 빌드 (서명 없이)
        run: |
          xcodebuild \
            -project AirDropTV.xcodeproj \
            -target AirDropTV \
            -sdk appletvos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 권한 주입 + .tipa 포장
        run: |
          set -euo pipefail
          APP="$(find build -type d -name 'AirDropTV.app' -print -quit)"
          test -n "$APP" || { echo "빌드 산출물을 찾지 못했습니다"; find build -name '*.app' -maxdepth 6; exit 1; }
          echo "산출물: $APP"

          BIN_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BIN="$APP/$BIN_NAME"

          echo "::group::ldid 가짜 서명 + 권한 주입"
          ldid -Sentitlements.plist "$BIN"
          echo "::endgroup::"

          echo "::group::주입된 권한 확인 (airdrop 키 2개가 보여야 합니다)"
          ldid -e "$BIN"
          echo "::endgroup::"

          # 권한이 실제로 들어갔는지 자동 검증 — 없으면 여기서 실패시킵니다
          ldid -e "$BIN" | grep -q 'com.apple.private.airdrop.discovery' \
            || { echo "✗ airdrop.discovery 권한이 주입되지 않았습니다"; exit 1; }
          ldid -e "$BIN" | grep -q 'com.apple.private.airdrop.settings' \
            || { echo "✗ airdrop.settings 권한이 주입되지 않았습니다"; exit 1; }
          echo "✓ 권한 2개 확인 완료"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AirDropTV.tipa Payload
          rm -rf Payload
          ls -lh AirDropTV.tipa

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: AirDropTV-tipa
          path: AirDropTV.tipa

      # 태그를 밀지 않아도 릴리스를 만듭니다. Actions 탭의 Run workflow 로
      # 실행하면 build-<번호> 라는 이름의 릴리스가 생기고, 그 자산 URL을
      # TrollStore 에 바로 넣을 수 있습니다.
      - name: 릴리스 발행
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          files: AirDropTV.tipa
          generate_release_notes: true
